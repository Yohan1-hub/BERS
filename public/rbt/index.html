<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BERS Institute · Preparación para el Examen RBT</title>
<link rel="stylesheet" href="css/styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
</head>
<body>
<style>
#lock-screen{position:fixed;inset:0;z-index:9999;background:linear-gradient(135deg,#0f172a 0%,#1e293b 50%,#0f172a 100%);display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',system-ui,sans-serif}
#lock-box{text-align:center;max-width:400px;width:90%}
#lock-box h2{color:#fff;font-size:1.5rem;margin-bottom:.25rem}
#lock-box p{color:#94a3b8;margin-bottom:1.5rem;font-size:.9rem}
#lock-box input{width:100%;padding:.75rem 1rem;border:2px solid #334155;border-radius:.5rem;background:#1e293b;color:#fff;font-size:1rem;box-sizing:border-box;outline:none;transition:border-color .2s}
#lock-box input:focus{border-color:#da5f28}
#lock-box input::placeholder{color:#64748b}
#lock-box button{margin-top:.75rem;width:100%;padding:.75rem;background:#da5f28;color:#fff;border:none;border-radius:.5rem;font-size:1rem;font-weight:600;cursor:pointer;transition:background .2s}
#lock-box button:hover{background:#c45220}
#lock-box .lock-err{color:#f87171;margin-top:.75rem;font-size:.85rem;min-height:1.2rem}
</style>
<div id="lock-screen">
  <div id="lock-box">
    <h2>🎓 Examen RBT</h2>
    <p>Acceso restringido — ingresa la contraseña</p>
    <input type="password" id="lock-pw" placeholder="Contraseña" autofocus>
    <button onclick="checkLock()">Entrar</button>
    <div class="lock-err" id="lock-err"></div>
  </div>
</div>
<script>
(function(){
  if(sessionStorage.getItem("rbt_ok")==="1"){document.getElementById("lock-screen").style.display="none";return}
  document.addEventListener("keydown",function(e){if(e.key==="Enter")checkLock()});
})();
function checkLock(){
  var p=document.getElementById("lock-pw").value;
  var h=0;for(var i=0;i<p.length;i++){h=((h<<5)-h)+p.charCodeAt(i);h|=0}
  if(h===19268340){document.getElementById("lock-screen").style.display="none";sessionStorage.setItem("rbt_ok","1")}
  else{document.getElementById("lock-err").textContent="Contraseña incorrecta"}
}
</script>
<header class="site-header">
  <div class="wrap header-inner">
    <div class="brand">
      <span class="brand-mark">B</span>
      <div>
        <h1>BERS Institute</h1>
        <p class="tagline">Preparación para el examen RBT</p>
      </div>
    </div>
    <nav class="main-nav">
      <button class="nav-btn is-active" data-nav="home">Inicio</button>
      <button class="nav-btn" data-nav="cards">Tarjetas</button>
      <button class="nav-btn" data-nav="guide">Guía</button>
    </nav>
  </div>
</header>

<div class="layout">
  <div class="layout-main" id="view" aria-live="polite"></div>
  <aside class="side-panel" id="side"></aside>
</div>

<footer class="site-footer">
  <div class="wrap">
    <p>BERS Institute · Tutoría de niños con autismo en Orlando, FL · Material de práctica RBT</p>
  </div>
</footer>

<script src="js/data.js"></script>
<script src="js/cards.js"></script>
<script src="js/guide.js"></script>
<script src="js/app.js"></script>
</body>
</html>
